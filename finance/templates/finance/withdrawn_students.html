{% extends "base_finance.html" %}
{% load static %}

{% block title %}سحب ملف طالب{% endblock %}

{% block content %}
<div class="container py-5" dir="rtl">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card bg-dark text-white border border-secondary shadow-lg rounded-4 p-4">
                <h3 class="fw-black text-danger mb-3 text-center">
                    <i class="bi bi-box-seam me-2"></i> سحب ملف الطالب نهائياً
                </h3>
                
                <div class="bg-secondary bg-opacity-20 p-3 rounded-3 mb-4 border border-secondary">
                    <h5 class="text-warning fw-bold mb-1">{{ student.get_full_name }}</h5>
                    <p class="text-white-50 small m-0">كود الطالب: <span class="text-white fw-mono">{{ student.student_code }}</span></p>
                    <p class="text-white-50 small m-0">إجمالي المدفوع سابقاً: <span class="text-success fw-bold">{{ total_paid }} ج.م</span></p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="from_screen" value="{{ from_screen }}">

                    <div class="mb-3">
                        <label class="form-label text-white-50 fw-bold small">المبلغ المسترد (إن وجد):</label>
                        <input type="number" name="refund_amount" step="0.01" value="0.00" class="form-control bg-black text-white border-secondary fw-bold text-center" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 fw-bold small">سبب سحب الملف:</label>
                        <textarea name="reason" rows="3" class="form-control bg-black text-white border-secondary" placeholder="اكتب سبب السحب هنا...">سحب ملف نهائي</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger w-100 fw-black py-2">
                            <i class="bi bi-check-circle me-1"></i> تأكيد سحب الملف وتصفير المديونية
                        </button>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary w-50 fw-bold py-2">إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
